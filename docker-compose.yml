# Capgo on self-hosted Supabase.
#
# supabase/ is an unmodified copy of upstream supabase/docker (update it with
# `sh supabase/update.sh`). Changes to upstream services live in
# docker-compose.override.yml, which docker compose loads automatically.
#
#   docker compose up -d --wait
#   docker compose down

name: supabase

include:
  - path: supabase/docker-compose.yml
    env_file: supabase/.env

services:
  capgo:
    image: capgo:12.312.0
    build:
      context: .
      dockerfile: ./capgo-docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8084:80"
