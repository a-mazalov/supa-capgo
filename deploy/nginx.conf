# Host nginx for Capgo on self-hosted Supabase (single domain).
# Supabase API paths go to Envoy (api-gw), everything else to the Capgo console.
# Studio is not exposed; use an SSH tunnel to 127.0.0.1:8000 instead.

server {
    listen 80;
    server_name updater.my.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name updater.my.com;

    ssl_certificate     /etc/letsencrypt/live/updater.my.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updater.my.com/privkey.pem;

    # bundle uploads go through the S3 endpoint
    client_max_body_size 500m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Supabase API (Envoy)
    location ~ ^/(auth|rest|storage|functions|realtime|graphql)/v1 {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # Capgo console
    location / {
        proxy_pass http://127.0.0.1:8084;
    }
}
