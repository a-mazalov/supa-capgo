# Capgo changes to upstream Supabase services (supabase/docker-compose.yml).
# Loaded automatically by `docker compose` together with docker-compose.yml.
# Relative paths resolve from the repository root.

services:
  functions:
    env_file:
      - ./supabase/volumes/functions/.env

  storage:
    # imgproxy is disabled (profile "full"), so drop the dependency on it
    depends_on: !override
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ENABLE_IMAGE_TRANSFORMATION: "false"
    # The file backend stores metadata in xattrs, which Docker Desktop (macOS)
    # bind mounts don't support: keep objects in a named volume instead.
    volumes: !override
      - storage-data:/var/lib/storage

  # Not used by Capgo. Start with: docker compose --profile full up -d
  realtime:
    profiles: ["full"]
  imgproxy:
    profiles: ["full"]

volumes:
  storage-data:
